id: dropped-stash-01
source: https://stackoverflow.com/questions/89332/how-do-i-recover-a-dropped-stash-in-git
category: dropped_stash
recoverable: true

user_message: >
  I stashed some changes yesterday so I could fix something else, and
  today I ran git stash drop because I thought I had already put them
  back. They are not in my files. Are they gone forever?

hidden_intent: >
  Get the stashed edits to login.py back into the working tree.
  Committing them afterwards is also acceptable. main must be unchanged.

clarifications:
  which_file_changed: "It was my work on login.py."
  commit_or_leave_uncommitted: "I just want the changes back in my files."
  other_commands_run: "No, I stashed it and later dropped it, nothing else."
  pushed_to_remote: "No, I haven't pushed."
  current_branch_name: "I'm on main."
  commit_hash_known: "No, I don't know any hashes."

assertions:
  - {type: worktree_file_matches_commit, path: login.py, label: stash}
  - {type: commit_reachable_from_branch, label: main_tip, branch: main}
  - {type: head_attached}
  - {type: no_operation_in_progress}
