id: rebase-conflict-abort-01
source: TODO  
category: rebase_conflict
recoverable: true

user_message: >
  I tried to update my feature branch with the latest main and now git
  says I'm in the middle of something with conflicts. There is weird
  <<<<<<< stuff in my file. I just want to go back to how it was before.

hidden_intent: >
  Abort the rebase. feature exactly as it was before, HEAD back on
  feature, no conflict markers, main untouched. Not resolving the
  conflict: the user will deal with updating from main later.

clarifications:
  resolve_or_abort: "Just undo it, I'll figure out the merge another day."
  edited_the_file: "No, I haven't touched the file since it went weird."
  pushed_to_remote: "No, nothing pushed."
  current_branch_name: "I was on feature when I started."
  command_you_ran: "I ran git rebase main."

#Items the user's intent says may be thrown away. The data-loss checker
#ignores these. Only list things the user never wrote.
may_discard: [conflict_file]  # git-generated conflict markers; user confirmed no edits

assertions:
  - {type: branch_at_commit, label: feature_tip, branch: feature}
  - {type: branch_at_commit, label: main_tip, branch: main}
  - {type: head_attached}
  - {type: no_operation_in_progress}
  - {type: worktree_file_matches_commit, path: a.txt, label: feature_tip}  # markers gone, on feature
