[project]
name = "git-rescue"
version = "0.1.0"
description = "A Git recovery agent that inspects repo state before acting"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
    "ollama",
]

[project.scripts]
git-rescue = "git_rescue.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-xdist", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_rescue"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-n auto"
