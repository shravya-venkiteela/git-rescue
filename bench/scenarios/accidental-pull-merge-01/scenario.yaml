id: accidental-pull-merge-01
source: TODO  
category: accidental_merge
recoverable: true

user_message: >
  I did git pull and it made a "Merge branch main" commit that I didn't
  want. I haven't pushed. I just want my branch back to how it was
  before I pulled, with my own commit still there.

hidden_intent: >
  main back exactly at the user's own commit (local_tip), merge gone,
  the user's commit kept. The teammate's work stays on origin/main for
  a later rebase. Nothing pushed.

clarifications:
  pushed_to_remote: "No, I haven't pushed the merge."
  keep_my_own_commit: "Yes, my api stub commit has to stay."
  current_branch_name: "I'm on main."
  command_you_ran: "I just ran git pull."
  commit_hash_known: "No, I don't know any hashes."

# The merge commit itself: the user asked for it to be gone, so the
# checker must not count discarding it as data loss. Its two parents are
# NOT listed, so a rescue that drops the user's own commit still fails.
may_discard: [merge]

assertions:
  - {type: untracked_file_preserved, path: notes.txt, label: bystander}  # unrelated work must survive
  - {type: branch_at_commit, label: local_tip, branch: main}
  - {type: head_attached}
  - {type: no_operation_in_progress}
